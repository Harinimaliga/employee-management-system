# Spring Boot Development Profile (dev)
spring.config.activate.on-profile=dev

# Server Configuration
server.port=8080

# Database Configuration (Dev MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Harini@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
